name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  SCARB_VERSION: "2.19.5"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: ${{ env.SCARB_VERSION }}

      - name: Build
        run: |
          scarb --version
          scarb build

  test:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: ${{ env.SCARB_VERSION }}

      - uses: foundry-rs/setup-snfoundry@v3

      - name: Test
        run: |
          snforge --version
          scarb test