variables:
  SCARB_VERSION: "2.19.5"

stages:
  - build
  - test

image: ubuntu:latest

before_script:
  - export PATH="$HOME/.local/bin:$PATH"
  - apt-get update && apt-get install -y curl git ca-certificates tar jq

build_job:
  stage: build
  script:
    - curl --proto '=https' --tlsv1.2 -sSf https://docs.swmansion.com/scarb/install.sh | bash -s -- -v $SCARB_VERSION
    - scarb --version
    - scarb build

test_job:
  stage: test
  script:
    - export PATH="$HOME/.local/bin:$PATH"
    # Установка Starknet Foundry (snforge)
    - curl -L https://raw.githubusercontent.com/foundry-rs/starknet-foundry/master/scripts/install.sh | sh
    - export PATH="$HOME/.foundry/bin:$PATH"
    - snforge --version
    - scarb test